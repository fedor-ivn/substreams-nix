name: Update Substreams

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Run update scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package in substreams substreams-sink-files; do
            echo "::group::$package"
            script=$(nix build --no-link --print-out-paths ".#$package.passthru.updateScript")
            "$script"
            echo "::endgroup::"
          done

      - name: Show changes
        run: git diff --stat

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: 'chore: update substreams packages'
          title: 'chore: update substreams packages'
          body: |
            Auto-generated update for Substreams packages
            (substreams, substreams-sink-files).

            Each package's `passthru.updateScript` resolves the latest upstream
            release and refreshes the hash for every supported platform.
          branch: auto-update/substreams
          delete-branch: true
          labels: dependencies
